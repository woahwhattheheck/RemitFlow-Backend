name: YVB84 v1 receipt composition

on:
  push:
    branches: ['cedar/yvb84-v1-receipt-check-cd79']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YVB_CANDIDATE: efb3ca93916e889bd50384fb68425c10da38b68e
      NODE_ENV: test
      ANALYTICS_CURSOR_SECRET: synthetic-yvb84-receipt-composition
    steps:
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/YieldVault-Backend-1
          ref: efb3ca93916e889bd50384fb68425c10da38b68e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Original dependency manifest
        run: |
          test "$(git rev-parse HEAD)" = "$YVB_CANDIDATE"
          node --version
          npm install --no-audit --no-fund
          npm ls --depth=0
      - name: Required maintained suite on the composed source
        run: npm test -- --test-concurrency=1
